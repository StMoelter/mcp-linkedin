name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - name: Tests and coverage reports
        run: >-
          uv run --locked pytest --junitxml=reports/junit.xml
          --cov-report=xml:reports/coverage.xml
          --cov-report=html:reports/coverage
      - run: uv build
      - name: Validate workflows
        run: >-
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo
          rhysd/actionlint:1.7.7
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 14
          if-no-files-found: error

  container:
    name: container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker build --tag mcp-linkedin:test .
      - name: Start container
        run: >-
          docker run --detach --name mcp-linkedin-test
          --read-only --tmpfs /tmp --cap-drop ALL
          --security-opt no-new-privileges:true
          --publish 127.0.0.1:8000:8000 mcp-linkedin:test
      - run: python3 scripts/smoke_test.py
      - name: Verify runtime user
        run: test "$(docker exec mcp-linkedin-test id -u)" = "10001"
      - name: Container logs
        if: always()
        run: docker logs mcp-linkedin-test
      - name: Stop container
        if: always()
        run: docker rm --force mcp-linkedin-test

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: mkdir -p reports
      - name: Dependency licenses
        run: uv run --locked pip-licenses --output-file=reports/licenses.json
      - name: Locked dependency inventory
        run: >-
          uv export --locked --all-groups --no-emit-project
          --output-file reports/requirements-audit.txt > /dev/null
      - name: Vulnerability audit
        run: >-
          uv run --locked pip-audit --strict --require-hashes --disable-pip
          --requirement reports/requirements-audit.txt
          --format=json --output=reports/audit.json
      - name: Security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          retention-days: 14
          if-no-files-found: error

  documentation:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - name: Markdown lint
        run: >-
          git ls-files -z '*.md' |
          xargs -0 uv run --locked pymarkdown --config .pymarkdown.json --strict-config scan
      - name: Internal links
        run: git ls-files '*.md' > "$RUNNER_TEMP/documentation-files.txt"
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: --offline --no-progress --files-from '${{ runner.temp }}/documentation-files.txt'
          fail: true
          failIfEmpty: true
          output: reports/links.md
      - name: Documentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-reports
          path: reports/
          retention-days: 14
          if-no-files-found: warn
