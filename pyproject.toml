[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-linkedin"
version = "0.1.0"
description = "A container-ready LinkedIn MCP server using Streamable HTTP."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Steffen Moelter" }]
dependencies = [
    "mcp>=2.3.0,<3",
    "starlette>=1.3.1,<2",
    "uvicorn>=0.41,<1",
]

[project.urls]
Repository = "https://github.com/StMoelter/mcp-linkedin"

[project.scripts]
mcp-linkedin = "mcp_linkedin.__main__:main"

[dependency-groups]
dev = [
    "httpx2>=2.13,<3",
    "mypy>=1.19,<2",
    "pip-audit>=2.10,<3",
    "pip-licenses>=5.5,<6",
    "pymarkdownlnt>=0.9,<1",
    "pytest>=9,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_linkedin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=mcp_linkedin",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
source = ["mcp_linkedin"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[tool.pip-licenses]
format = "json"
from = "mixed"
with-system = true
ignore-packages = ["mcp-linkedin"]
allow-only = "0BSD;Apache-2.0;Apache Software License;BSD License;BSD-2-Clause;BSD-3-Clause;CC0-1.0;ISC;ISC License (ISCL);MIT;MIT License;MIT-0;MPL-2.0;Mozilla Public License 2.0 (MPL 2.0);PSF-2.0;Python-2.0;Python Software Foundation License;Unlicense;The Unlicense (Unlicense);Apache-2.0 OR BSD-3-Clause;Apache-2.0 OR BSD-2-Clause;MIT OR Apache-2.0"
